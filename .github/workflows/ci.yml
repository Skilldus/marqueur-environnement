name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Package Chrome
        run: cd dist && zip -r ../extension-chrome.zip .

      - name: Package Firefox
        run: cd dist && zip -r ../extension-firefox.zip .

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension-chrome.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: extension-firefox.zip

