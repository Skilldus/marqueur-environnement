<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration</title>
    <link rel="stylesheet" href="styles/options.css" />
</head>
<body class="options-page">
<main class="options-container">
    <section class="card">
        <h1>Configuration des environnements</h1>
        <p class="subtitle">Ajoutez et gérez les règles d'affichage des bandeaux.</p>

        <div class="form-section">
            <h2 id="formTitle" class="form-title">Ajouter une règle</h2>
            <form id="ruleForm" class="rule-form">
                <div class="field">
                    <label for="pattern">Regex</label>
                    <input id="pattern" placeholder="ex: .*dev.*" required />
                </div>

                <div class="field">
                    <label for="label">Label</label>
                    <input id="label" placeholder="DEV" required />
                </div>

                <div class="field">
                    <label for="color">Couleur</label>
                    <input type="color" id="color" value="#e53935" />
                </div>

                <div class="field">
                    <label for="position">Position</label>
                    <select id="position">
                        <option value="top">Bandeau haut</option>
                        <option value="bottom">Bandeau bas</option>
                        <option value="top-left">Coin haut gauche</option>
                        <option value="top-right">Coin haut droite</option>
                        <option value="bottom-left">Coin bas gauche</option>
                        <option value="bottom-right">Coin bas droite</option>
                    </select>
                </div>

                <div class="field">
                    <label for="size">Taille</label>
                    <select id="size">
                        <option value="small">Petite</option>
                        <option value="medium" selected>Moyenne</option>
                        <option value="large">Grande</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn" id="submitRule">Ajouter</button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit" hidden>Annuler</button>
                </div>
            </form>
        </div>

        <div class="io-section">
            <button type="button" class="btn btn-export" id="exportBtn">⬇️ Exporter les règles</button>
            <button type="button" class="btn btn-import" id="importBtn" onclick="document.getElementById('importFile').click()">⬆️ Importer des règles</button>
            <input type="file" id="importFile" accept=".json" hidden />
            <span id="importFeedback" class="import-feedback" hidden></span>
        </div>

        <div class="rules-section">
            <h2 class="section-title">Règles configurées (<span id="rulesCount">0</span>)</h2>
            <ul id="rules" class="rules-list"></ul>
            <p id="emptyState" class="empty-state" hidden>Aucune règle configurée. Ajoutez-en une ci-dessus.</p>
        </div>
    </section>
</main>

<script src="options.js"></script>
</body>
</html>
