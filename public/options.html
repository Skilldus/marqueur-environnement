<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration</title>
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link rel="stylesheet" href="styles/options.css" />
</head>
<body class="options-page">
<main class="options-container">
    <section class="card">
        <header class="page-header">
            <div>
                <h1 data-i18n="heading">Configuration des environnements</h1>
                <p class="subtitle" data-i18n="subtitle">Ajoutez et gérez les règles d'affichage des bandeaux.</p>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </header>

        <div class="form-section">
            <p class="section-label" id="formTitle">Nouvelle règle</p>
            <form id="ruleForm" class="rule-form">
                <div class="field">
                    <label for="pattern" data-i18n="fieldRegex">Regex</label>
                    <input id="pattern" placeholder=".*dev.*" required />
                </div>

                <div class="field">
                    <label for="label" data-i18n="fieldLabel">Label</label>
                    <input id="label" placeholder="DEV" required />
                </div>

                <div class="field">
                    <label for="color" data-i18n="fieldColor">Couleur</label>
                    <input type="color" id="color" value="#e53935" />
                </div>

                <div class="field">
                    <label for="position" data-i18n="fieldPosition">Position</label>
                    <select id="position">
                        <option value="top"          data-i18n="positionTop">Bandeau haut</option>
                        <option value="bottom"       data-i18n="positionBottom">Bandeau bas</option>
                        <option value="top-left"     data-i18n="positionTopLeft">Coin haut gauche</option>
                        <option value="top-right"    data-i18n="positionTopRight">Coin haut droite</option>
                        <option value="bottom-left"  data-i18n="positionBottomLeft">Coin bas gauche</option>
                        <option value="bottom-right" data-i18n="positionBottomRight">Coin bas droite</option>
                    </select>
                </div>

                <div class="field">
                    <label for="size" data-i18n="fieldSize">Taille</label>
                    <select id="size">
                        <option value="small"  data-i18n="sizeSmall">Petite</option>
                        <option value="medium" data-i18n="sizeMedium" selected>Moyenne</option>
                        <option value="large"  data-i18n="sizeLarge">Grande</option>
                        <option value="custom" data-i18n="sizeCustom">Personnalisée</option>
                    </select>
                </div>

                <div id="customSizePanel" class="custom-size-panel" hidden>
                    <div class="custom-size-row">
                        <div class="field">
                            <label for="customHeight" data-i18n="fieldCustomHeight">Hauteur (px)</label>
                            <input type="number" id="customHeight" min="10" max="200" value="28" />
                        </div>
                        <div class="field">
                            <label for="customFontSize" data-i18n="fieldCustomFontSize">Taille texte (px)</label>
                            <input type="number" id="customFontSize" min="8" max="100" value="16" />
                        </div>
                    </div>
                </div>

                <div id="textStylePanel" class="text-style-panel">
                    <div class="text-style-row">
                        <label class="toggle-label" for="customTextColorEnabled">
                            <input type="checkbox" id="customTextColorEnabled" />
                            <span data-i18n="fieldTextColor">Couleur du texte</span>
                        </label>
                        <input type="color" id="textColor" value="#ffffff" class="inline-color-picker" disabled />
                    </div>
                    <div class="text-style-row">
                        <label class="toggle-label" for="borderColorEnabled">
                            <input type="checkbox" id="borderColorEnabled" />
                            <span data-i18n="fieldBorderColor">Bordure du texte</span>
                        </label>
                        <input type="color" id="borderColor" value="#000000" class="inline-color-picker" disabled />
                    </div>
                </div>

                <div id="previewPanel" class="preview-panel">
                    <div class="preview-wrap">
                        <span class="preview-label-text" data-i18n="previewLabel">Aperçu</span>
                        <div class="preview-viewport">
                            <div id="previewBanner" class="preview-banner">
                                <span id="previewText"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitRule">Ajouter</button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit" hidden data-i18n="btnCancel">Annuler</button>
                </div>
            </form>
        </div>

        <div class="io-section">
            <button type="button" class="btn btn-outline" id="exportBtn" data-i18n="btnExport">Exporter</button>
            <button type="button" class="btn btn-outline" id="importBtn" data-i18n="btnImport">Importer</button>
            <input type="file" id="importFile" accept=".json" hidden />
            <span id="importFeedback" class="import-feedback" hidden></span>
        </div>

        <div class="divider"></div>

        <div class="rules-section">
            <p class="section-label">
                <span data-i18n="sectionRulesTitle">Règles configurées</span> (<span id="rulesCount">0</span>)
            </p>
            <ul id="rules" class="rules-list"></ul>
            <p id="emptyState" class="empty-state" hidden data-i18n="emptyState">Aucune règle configurée.</p>
        </div>
    </section>
</main>

<script src="options.js"></script>
</body>
</html>
